spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/kredi_db
    username: ${DB_USERNAME:felece}
    password: ${DB_PASSWORD:}
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.type.descriptor.sql.BasicBinder: trace
